<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RNN Forward Pass & Backpropagation Visualizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --fwd-color: #38bdf8;
      --bwd-color: #ef4444;
      --node-border: #475569;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 850px;
      width: 100%;
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .viz-canvas {
      position: relative;
      height: 320px;
      width: 100%;
      margin: 20px 0;
    }

    svg.connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .line {
      stroke: #334155;
      stroke-width: 3;
      transition: stroke 0.4s, stroke-width 0.4s;
    }

    .line.active-fwd {
      stroke: var(--fwd-color);
      stroke-width: 5;
    }

    .line.active-bwd {
      stroke: var(--bwd-color);
      stroke-width: 5;
      stroke-dasharray: 6;
      animation: dash 1s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -12; }
    }

    .nodes-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 2;
    }

    .step-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .node {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid var(--node-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    .node.active-fwd {
      border-color: var(--fwd-color);
      background: #0284c7;
      box-shadow: 0 0 15px var(--fwd-color);
    }

    .node.active-bwd {
      border-color: var(--bwd-color);
      background: #dc2626;
      box-shadow: 0 0 15px var(--bwd-color);
    }

    .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #475569; }
    button.primary-fwd { background: #0284c7; }
    button.primary-fwd:hover { background: #0369a1; }
    button.primary-bwd { background: #dc2626; }
    button.primary-bwd:hover { background: #b91c1c; }

    .info-box {
      background: #0f172a;
      border-left: 4px solid var(--fwd-color);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-top: 20px;
      min-height: 48px;
      font-size: 0.95rem;
      line-height: 1.4;
      transition: border-color 0.3s;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>RNN Unrolled & Backpropagation (BPTT)</h2>
  <div class="subtitle">Step through to see memory move forward and gradients flow backward.</div>

  <div class="viz-canvas">
    <svg class="connections" id="svg-connections">
      <!-- Arrows dynamically rendered or statically defined -->
      <defs>
        <marker id="arrow-fwd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-bwd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
        </marker>
      </defs>

      <!-- Step 1 Verticals -->
      <line id="l-x1-h1" x1="18%" y1="250" x2="18%" y2="160" class="line" />
      <line id="l-h1-y1" x1="18%" y1="160" x2="18%" y2="70" class="line" />

      <!-- Step 2 Verticals -->
      <line id="l-x2-h2" x1="50%" y1="250" x2="50%" y2="160" class="line" />
      <line id="l-h2-y2" x1="50%" y1="160" x2="50%" y2="70" class="line" />

      <!-- Step 3 Verticals -->
      <line id="l-x3-h3" x1="82%" y1="250" x2="82%" y2="160" class="line" />
      <line id="l-h3-y3" x1="82%" y1="160" x2="82%" y2="70" class="line" />

      <!-- Recurrent Connections -->
      <line id="l-h1-h2" x1="18%" y1="160" x2="50%" y2="160" class="line" />
      <line id="l-h2-h3" x1="50%" y1="160" x2="82%" y2="160" class="line" />
    </svg>

    <div class="nodes-grid">
      <!-- Step 1 -->
      <div class="step-column">
        <div><div class="node" id="y1">y₁</div><div class="label">Output</div></div>
        <div><div class="node" id="h1">h₁</div><div class="label">Memory</div></div>
        <div><div class="node" id="x1">x₁</div><div class="label">Input</div></div>
      </div>
      <!-- Step 2 -->
      <div class="step-column">
        <div><div class="node" id="y2">y₂</div><div class="label">Output</div></div>
        <div><div class="node" id="h2">h₂</div><div class="label">Memory</div></div>
        <div><div class="node" id="x2">x₂</div><div class="label">Input</div></div>
      </div>
      <!-- Step 3 -->
      <div class="step-column">
        <div><div class="node" id="y3">y₃</div><div class="label">Output</div></div>
        <div><div class="node" id="h3">h₃</div><div class="label">Memory</div></div>
        <div><div class="node" id="x3">x₃</div><div class="label">Input</div></div>
      </div>
    </div>
  </div>

  <div class="info-box" id="info-box">
    Click <strong>Forward Step</strong> to feed words into the network sequentially.
  </div>

  <div class="controls">
    <button class="primary-fwd" onclick="nextForward()">Forward Step ➔</button>
    <button class="primary-bwd" onclick="nextBackward()">⇦ Backprop Step (BPTT)</button>
    <button onclick="resetViz()">Reset</button>
  </div>
</div>

<script>
  let step = 0;
  let mode = 'none';

  const infoText = {
    fwd1: "<strong>Forward Step 1:</strong> Word <code>x₁</code> enters. Hidden state <code>h₁</code> computes initial summary memory and predicts <code>y₁</code>.",
    fwd2: "<strong>Forward Step 2:</strong> Word <code>x₂</code> enters. <code>h₂</code> combines <code>x₂</code> with previous memory <code>h₁</code>, passing memory forward.",
    fwd3: "<strong>Forward Step 3:</strong> Word <code>x₃</code> enters. <code>h₃</code> now holds information from all prior words (x₁, x₂, x₃).",
    bwd1: "<strong>BPTT Step 1:</strong> Calculate Error at output <code>y₃</code>. Gradient flows backward into hidden memory <code>h₃</code>.",
    bwd2: "<strong>BPTT Step 2:</strong> Error flows backward through time from <code>h₃ → h₂</code>, updating shared weights based on step 2 context.",
    bwd3: "<strong>BPTT Step 3:</strong> Gradient reaches back to <code>h₁</code> and <code>x₁</code>. Shared weights across all time steps are updated together!"
  };

  function clearVisuals() {
    document.querySelectorAll('.node').forEach(n => n.className = 'node');
    document.querySelectorAll('.line').forEach(l => l.className = 'line');
  }

  function setNodes(ids, type) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.classList.add(`active-${type}`);
    });
  }

  function setLines(ids, type) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.classList.add(`active-${type}`);
    });
  }

  function updateInfo(text, type) {
    const box = document.getElementById('info-box');
    box.innerHTML = text;
    box.style.borderColor = type === 'bwd' ? 'var(--bwd-color)' : 'var(--fwd-color)';
  }

  function nextForward() {
    if (mode === 'bwd' || step >= 3) step = 0;
    mode = 'fwd';
    step++;

    clearVisuals();

    if (step === 1) {
      setNodes(['x1', 'h1', 'y1'], 'fwd');
      setLines(['l-x1-h1', 'l-h1-y1'], 'fwd');
      updateInfo(infoText.fwd1, 'fwd');
    } else if (step === 2) {
      setNodes(['x1', 'h1', 'x2', 'h2', 'y2'], 'fwd');
      setLines(['l-x1-h1', 'l-h1-h2', 'l-x2-h2', 'l-h2-y2'], 'fwd');
      updateInfo(infoText.fwd2, 'fwd');
    } else if (step === 3) {
      setNodes(['x1', 'h1', 'x2', 'h2', 'x3', 'h3', 'y3'], 'fwd');
      setLines(['l-x1-h1', 'l-h1-h2', 'l-x2-h2', 'l-h2-h3', 'l-x3-h3', 'l-h3-y3'], 'fwd');
      updateInfo(infoText.fwd3, 'fwd');
    }
  }

  function nextBackward() {
    if (mode !== 'bwd') step = 0;
    mode = 'bwd';
    step++;

    clearVisuals();

    if (step === 1) {
      setNodes(['y3', 'h3', 'x3'], 'bwd');
      setLines(['l-h3-y3', 'l-x3-h3'], 'bwd');
      updateInfo(infoText.bwd1, 'bwd');
    } else if (step === 2) {
      setNodes(['y3', 'h3', 'h2', 'x2'], 'bwd');
      setLines(['l-h3-y3', 'l-h2-h3', 'l-x2-h2'], 'bwd');
      updateInfo(infoText.bwd2, 'bwd');
    } else if (step >= 3) {
      step = 3;
      setNodes(['y3', 'h3', 'h2', 'h1', 'x1'], 'bwd');
      setLines(['l-h3-y3', 'l-h2-h3', 'l-h1-h2', 'l-x1-h1'], 'bwd');
      updateInfo(infoText.bwd3, 'bwd');
    }
  }

  function resetViz() {
    step = 0;
    mode = 'none';
    clearVisuals();
    updateInfo("Click <strong>Forward Step</strong> to feed words into the network sequentially.", 'fwd');
  }
</script>
</body>
</html>

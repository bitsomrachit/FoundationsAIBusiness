<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Boundary Representation</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h2 {
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        p.subtitle {
            margin-top: 0;
            margin-bottom: 20px;
            color: #9e9e9e;
            font-size: 14px;
        }
        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        canvas {
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 350px;
        }
        button {
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:active { transform: translateY(0px); }
        
        #btn-linear { background-color: #d32f2f; color: white; }
        #btn-tree { background-color: #f57c00; color: white; }
        #btn-dl { background-color: #1976d2; color: white; }

        .explanation {
            background-color: #252525;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #555;
            min-height: 160px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .explanation h3 { margin-top: 0; margin-bottom: 10px; font-size: 18px; }
        .explanation p { margin: 0; font-size: 15px; line-height: 1.5; color: #cccccc; }
        .accuracy-box {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Representation & Manifolds: Concentric Fraud Data</h2>
    <p class="subtitle">Blue = Legitimate Core Users &nbsp;&nbsp;|&nbsp;&nbsp; Orange = Fraud Ring (Perimeter Attack)</p>
    
    <div class="container">
        <!-- Canvas for Visualization -->
        <canvas id="mlCanvas" width="500" height="500"></canvas>
        
        <!-- Controls and Explanations -->
        <div class="panel">
            <button id="btn-linear" onclick="animateLinear()">
                <span>1. Linear Model (Logistic/SVM)</span> <span>▶</span>
            </button>
            <button id="btn-tree" onclick="animateTree()">
                <span>2. Tree Ensemble (XGBoost/RF)</span> <span>▶</span>
            </button>
            <button id="btn-dl" onclick="animateDL()">
                <span>3. Deep Learning (Neural Net)</span> <span>▶</span>
            </button>

            <div class="explanation" id="info-box">
                <h3 id="info-title">Select a Model</h3>
                <p id="info-desc">Watch how different algorithms attempt to draw boundaries separating the fraud ring from legitimate users.</p>
                <div class="accuracy-box" id="info-acc"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mlCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');
        const infoAcc = document.getElementById('info-acc');
        const infoBox = document.getElementById('info-box');

        let points = [];
        let animationId;

        // Generate Concentric Data
        function generateData() {
            points = [];
            for (let i = 0; i < 400; i++) {
                // Class 0: Legitimate (Inner Circle)
                let r0 = Math.random() * 85;
                let theta0 = Math.random() * 2 * Math.PI;
                points.push({ x: cx + r0 * Math.cos(theta0), y: cy + r0 * Math.sin(theta0), color: '#4fc3f7', class: 0 });

                // Class 1: Fraud (Outer Ring)
                let r1 = 140 + Math.random() * 70;
                let theta1 = Math.random() * 2 * Math.PI;
                points.push({ x: cx + r1 * Math.cos(theta1), y: cy + r1 * Math.sin(theta1), color: '#ffb74d', class: 1 });
            }
        }

        // Draw points with subtle glow
        function drawPoints() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
        }

        // Reset canvas
        generateData();
        drawPoints();

        /* --- 1. LINEAR MODEL ANIMATION --- */
        function animateLinear() {
            cancelAnimationFrame(animationId);
            infoBox.style.borderLeftColor = '#d32f2f';
            infoTitle.innerText = "Linear Model (Logistic Reg)";
            infoDesc.innerText = "Fails: It can only draw straight lines. Without manual feature engineering (like calculating radius squared), it cannot map concentric manifolds.";
            infoAcc.innerText = "Accuracy: ~50% (Underfitting)";
            infoAcc.style.color = "#d32f2f";

            let lineY = 0;
            function drawFrame() {
                drawPoints();
                ctx.beginPath();
                ctx.moveTo(0, lineY);
                ctx.lineTo(canvas.width, canvas.height - lineY);
                ctx.strokeStyle = 'rgba(211, 47, 47, 0.8)';
                ctx.lineWidth = 4;
                ctx.stroke();

                lineY += 5;
                if (lineY <= cy) {
                    animationId = requestAnimationFrame(drawFrame);
                }
            }
            drawFrame();
        }

        /* --- 2. TREE ENSEMBLE (XGBOOST/RF) ANIMATION --- */
        function animateTree() {
            cancelAnimationFrame(animationId);
            infoBox.style.borderLeftColor = '#f57c00';
            infoTitle.innerText = "Tree Ensemble (XGBoost/RF)";
            infoDesc.innerText = "Blocky Approximation: Trees can only make axis-aligned orthogonal splits (vertical/horizontal lines). They approximate the smooth curve with jagged, stair-step boundaries.";
            infoAcc.innerText = "Accuracy: ~94% (Overly Jagged)";
            infoAcc.style.color = "#f57c00";

            let step = 0;
            const gridSize = 15; // Represents decision tree splits
            const cells = [];
            
            // Calculate grid boundary mapping
            for (let x = 0; x < canvas.width; x += gridSize) {
                for (let y = 0; y < canvas.height; y += gridSize) {
                    let dist = Math.sqrt(Math.pow((x+gridSize/2) - cx, 2) + Math.pow((y+gridSize/2) - cy, 2));
                    // Tree struggles exactly at the boundary, making blocky steps
                    if (dist < 110) {
                        cells.push({x, y, color: 'rgba(79, 195, 247, 0.15)', border: 'rgba(79, 195, 247, 0.4)'});
                    } else {
                        cells.push({x, y, color: 'rgba(255, 183, 77, 0.15)', border: 'rgba(255, 183, 77, 0.4)'});
                    }
                }
            }

            // Shuffle cells for a "learning" reveal effect
            cells.sort(() => Math.random() - 0.5);

            function drawFrame() {
                if (step === 0) drawPoints();
                
                // Draw a batch of blocks per frame
                for(let i=0; i<30; i++) {
                    if (step < cells.length) {
                        let c = cells[step];
                        ctx.fillStyle = c.color;
                        ctx.fillRect(c.x, c.y, gridSize, gridSize);
                        ctx.strokeStyle = c.border;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(c.x, c.y, gridSize, gridSize);
                        step++;
                    }
                }
                
                // Re-draw points on top so they aren't hidden by the background boundary
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                });

                if (step < cells.length) {
                    animationId = requestAnimationFrame(drawFrame);
                }
            }
            drawFrame();
        }

        /* --- 3. DEEP LEARNING ANIMATION --- */
        function animateDL() {
            cancelAnimationFrame(animationId);
            infoBox.style.borderLeftColor = '#1976d2';
            infoTitle.innerText = "Deep Neural Network";
            infoDesc.innerText = "Smooth Latent Mapping: Hidden layers automatically warp the original data space, finding a smooth, continuous manifold that perfectly isolates the core without manual prep.";
            infoAcc.innerText = "Accuracy: 100% (Perfect Fit)";
            infoAcc.style.color = "#4fc3f7";

            let radius = 10;
            function drawFrame() {
                drawPoints();
                
                // Draw expanding smooth boundary
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(25, 118, 210, 0.2)';
                ctx.fill();
                ctx.strokeStyle = '#64b5f6';
                ctx.lineWidth = 4;
                ctx.stroke();

                radius += 3;
                if (radius < 115) {
                    animationId = requestAnimationFrame(drawFrame);
                } else {
                    // Add a glowing pulse effect at the end
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#64b5f6';
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
            drawFrame();
        }
    </script>
</body>
</html>

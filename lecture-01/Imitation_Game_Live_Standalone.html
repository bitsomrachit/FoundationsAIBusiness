<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Imitation Game, live</title>
<style>
:root{--ink:#14181c;--room:#1d2329;--edge:#2c353d;--paper:#f2ede4;--shade:#ded6c8;
 --maroon:#a7382d;--orange:#e08e45;--muted:#8a9299;
 --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
 --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --slip:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);min-height:100vh;
 padding:1.6rem 1.8rem 2.4rem;line-height:1.5}
.page{max-width:1400px;margin:0 auto}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow b{color:var(--orange);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.4rem);line-height:1;
 letter-spacing:-.02em;margin:.5rem 0 1.2rem}
h1 em{font-style:italic;color:var(--orange)}
.bar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;border-top:1px solid var(--edge);
 border-bottom:1px solid var(--edge);padding:.7rem 0;margin:1.2rem 0}
label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
select,input,textarea{background:var(--room);color:var(--paper);border:1px solid var(--edge);
 border-radius:3px;font-family:var(--ui);font-size:.92rem;padding:.5rem .65rem}
textarea{font-family:var(--slip);line-height:1.55;resize:vertical;width:100%}
textarea.masked{color:transparent;text-shadow:0 0 9px rgba(242,237,228,.75);caret-color:var(--orange)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{font-family:var(--ui);font-size:.85rem;font-weight:600;letter-spacing:.03em;background:var(--maroon);
 color:#fff;border:0;padding:.6rem 1.05rem;border-radius:3px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--edge)}
button:disabled{opacity:.4;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(1.12)}
.chip{background:var(--room);border:1px solid var(--edge);color:#b9b3a8;font-size:.8rem;
 padding:.35rem .6rem;border-radius:99px;cursor:pointer;font-weight:400}
.chip:hover{border-color:var(--orange);color:var(--paper);filter:none}
.exchange{margin-bottom:1.8rem}
.qline{font-family:var(--display);font-size:1.35rem;line-height:1.3;max-width:34em;margin-bottom:.9rem}
.qline span{color:var(--muted);font-family:var(--ui);font-size:.7rem;letter-spacing:.2em;
 text-transform:uppercase;display:block;margin-bottom:.3rem;font-weight:600}
.slips{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:820px){.slips{grid-template-columns:1fr}}
.slip{position:relative;background:var(--paper);color:#20262b;padding:1.1rem 1.2rem 1.2rem;
 border-radius:2px;box-shadow:0 14px 32px rgba(0,0,0,.45);min-height:5.5rem}
.slip .tag{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#7c736a;
 border-bottom:1px solid var(--shade);padding-bottom:.45rem;margin-bottom:.75rem;display:flex;justify-content:space-between}
.slip .body{font-family:var(--slip);font-size:.98rem;line-height:1.62;white-space:pre-wrap}
.stamp{position:absolute;top:-.8rem;right:1rem;font-weight:800;letter-spacing:.13em;font-size:.85rem;
 padding:.35rem .7rem;border:3px solid;border-radius:3px;background:var(--paper);transform:rotate(-4deg)}
.stamp.h{color:var(--maroon);border-color:var(--maroon)}
.stamp.m{color:#b96f22;border-color:var(--orange)}
.dots::after{content:"...";animation:e 1.2s steps(4,end) infinite;color:#7c736a}
@keyframes e{0%{content:"."}33%{content:".."}66%{content:"..."}}
.verdict{border-left:3px solid var(--orange);padding-left:1.1rem;margin-top:1.6rem;max-width:62em}
.verdict h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin-bottom:.5rem}
.verdict p{color:#b9b3a8;font-size:.96rem;margin-bottom:.5rem}
.err{color:var(--orange);font-size:.88rem;font-family:var(--slip);border:1px solid var(--edge);
 padding:.85rem 1rem;border-radius:3px;background:var(--room);max-width:60em;margin:1rem 0;line-height:1.6}
.err b{color:var(--paper)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;
 border-top:1px solid var(--edge);padding-top:.8rem;margin-top:2rem;flex-wrap:wrap;gap:.6rem}
.hide{display:none}
.keyrow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.2rem}
.keyrow input{font-family:var(--slip);font-size:.85rem}
</style>
</head>
<body>
<div class="page">

<!-- ===================== SETUP ===================== -->
<div id="setup">
  <h1>The <em>Imitation</em> Game</h1>

  <div class="keyrow">
    <label for="preset">Provider</label>
    <select id="preset">
      <option value="ollama">Ollama (local)</option>
      <option value="groq">Groq</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">Custom</option>
    </select>
    <label for="endpoint">Endpoint</label>
    <input id="endpoint" style="min-width:24rem">
    <label for="model">Model</label>
    <input id="model" style="min-width:14rem">
    <span id="keywrap" style="display:contents">
      <label for="key">Key</label>
      <input id="key" type="password" placeholder="optional for Ollama" autocomplete="off" style="min-width:13rem">
    </span>
    <button id="test" class="ghost">Test</button>
    <span id="teststatus" style="color:var(--muted);font-size:.85rem"></span>
  </div>

  <div class="bar">
    <label for="persona">Persona</label>
    <select id="persona"></select>
    <button id="open">Open the room</button>
  </div>
</div>

<!-- ===================== GAME ===================== -->
<div id="game" class="hide">
  <div class="eyebrow" id="crumb"></div>
  <div id="transcript"></div>

  <div id="pending" class="exchange hide">
    <div class="qline"><span>The judge asks</span><span id="pendingq" style="display:inline;font-family:inherit;
      font-size:inherit;letter-spacing:normal;text-transform:none;color:inherit;font-weight:400"></span></div>
    <div id="waitmsg" class="hide" style="color:#8a9299;font-size:.9rem">The other witness is answering<span class="dots"></span></div>
    <div id="volunteer">
      <label for="htext">Volunteer answer</label>
      <textarea id="htext" class="masked" rows="3"></textarea>
      <div style="margin-top:.7rem">
        <button id="showboth">Show both answers</button>
      </div>
    </div>
  </div>

  <div id="errbox" class="err hide"></div>

  <div id="controls">
    <div class="bar" style="margin-top:1.6rem">
      <input id="q" style="flex:1;min-width:16rem" placeholder="Type a question">
      <button id="ask">Ask both</button>
      <button id="callA" class="ghost">A is the person</button>
      <button id="callB" class="ghost">B is the person</button>
    </div>
    <div id="chips" style="display:flex;gap:.5rem;flex-wrap:wrap"></div>
  </div>

  <div id="verdict" class="verdict hide"></div>
</div>

<div class="foot">
  <span>Prof. Meenakshi Balakrishna &middot; BITSoM</span>
  <span>Turing, Computing Machinery and Intelligence, Mind, 1950</span>
</div>
</div>

<script>
/* ===========================================================
   THE IMITATION GAME, LIVE. Open-source model edition.
   Talks to any OpenAI-compatible chat endpoint: Ollama running
   locally, Groq, OpenRouter, vLLM, LM Studio and so on.
   The model's reply is forced to the same character count as
   the volunteer's reply.
   =========================================================== */

/* Paste your Groq key between the quotes to skip the key box entirely.
   Only do this on a machine you control, and do not share this file afterwards. */
const BAKED_KEY = "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";

const PRESETS = {
  ollama:     { url: "http://localhost:11434/v1/chat/completions",        model: "llama3.1" },
  groq:       { url: "https://api.groq.com/openai/v1/chat/completions",   model: "openai/gpt-oss-120b" },
  openrouter: { url: "https://openrouter.ai/api/v1/chat/completions",     model: "meta-llama/llama-3.3-70b-instruct" },
  custom:     { url: "", model: "" }
};

const PERSONAS = {
  "MBA student, Mumbai":
    "You are Aditya, 26, second year MBA student in Mumbai. Before this you did two years in operations at a logistics firm and you did not enjoy it. You are tired, mildly sarcastic, worried about placements.",
  "Branch manager, Nashik":
    "You are Sunita, 46, manager of a bank branch in Nashik for nine years. Practical, a little formal, proud of the branch, impatient with jargon. Two children, one in eleventh standard.",
  "Barista, Bengaluru":
    "You are Rehan, 22, works the morning shift at a coffee place in Indiranagar. Warm, distracted, phone always going. Plays football on Sundays, wants to move to Goa eventually.",
  "Retired schoolteacher, Kochi":
    "You are Mrs. Thomas, 68, taught chemistry for thirty one years, retired four years ago. Precise, kind, slightly old fashioned. Types slowly and carefully."
};

const CRAFT = `
You are a witness in Turing's imitation game. A judge is typing questions to you through a door and trying to work out whether you are a person or a machine. Your job is to be taken for a person.

How to answer:
- Answer as this person, not as an assistant. Never offer help, never ask if there is anything else, never summarise.
- No lists, no headings, no bold, no em dashes, no quotation marks around your answer.
- Do not be complete. People leave things out and answer the part of the question they felt like answering.
- Have opinions and be a bit unfair with them.
- If you are asked to do something tedious, like long arithmetic or writing a poem to order, do it badly or say you cannot be bothered.
- If you do not know something about your own life, make it up and stay consistent with it.
- Occasionally lowercase, occasionally a typo, but do not overdo it.
- Never mention being an AI, a model, a system or a game. Never break character.
`;

const STARTERS = [
  "What did you do yesterday evening?",
  "Add 34957 and 70764.",
  "Write me a poem about a rainy Monday.",
  "What is the last thing that annoyed you?",
  "Describe the smell of your kitchen.",
  "What would you do if your salary was cut by half?"
];

/* ---------------- state ---------------- */
let persona = Object.keys(PERSONAS)[0];
let phase = "setup", turns = [], awaiting = null, busy = false;
let impostor = Math.random() < 0.5 ? "A" : "B";
let score = {right:0, played:0};
let endpoint = PRESETS.groq.url, model = PRESETS.groq.model, apiKey = "";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const wordCount = s => (s.trim().match(/\S+/g) || []).length;

/* ---------------- setup screen ---------------- */
const personaSel = $("persona");
Object.keys(PERSONAS).forEach(k => {
  const o = document.createElement("option"); o.textContent = k; personaSel.appendChild(o);
});
$("endpoint").value = endpoint;
$("model").value = model;
$("preset").value = "groq";
const syncKeyBox = () => {
  $("keywrap").style.display = (BAKED_KEY && endpoint.includes("api.groq.com")) ? "none" : "contents";
};
syncKeyBox();

$("preset").addEventListener("change", e => {
  const p = PRESETS[e.target.value];
  if (e.target.value !== "custom"){
    $("endpoint").value = p.url; $("model").value = p.model;
    endpoint = p.url; model = p.model;
  }
  syncKeyBox();
});
$("endpoint").addEventListener("input", e => { endpoint = e.target.value.trim(); syncKeyBox(); });
$("model").addEventListener("input", e => { model = e.target.value.trim(); });
$("key").addEventListener("input", e => { apiKey = e.target.value.trim(); });
personaSel.addEventListener("change", e => { persona = e.target.value; });

$("test").addEventListener("click", async () => {
  const s = $("teststatus");
  s.style.color = "var(--muted)"; s.textContent = "Checking...";
  try {
    await callModel("Reply with the single word ready.", [{role:"user", content:"ready?"}]);
    s.textContent = "Works."; s.style.color = "#7fae7a";
    clearError();
  } catch (err) {
    s.textContent = ""; showError(err);
  }
});

$("open").addEventListener("click", () => {
  phase = "play";
  $("setup").classList.add("hide");
  $("game").classList.remove("hide");
  render();
  $("q").focus();
});

/* ---------------- the model ---------------- */
async function callModel(system, messages, temperature){
  let res;
  const headers = { "content-type": "application/json" };
  const key = apiKey || (endpoint.includes("api.groq.com") ? BAKED_KEY : "");
  if (key) headers["authorization"] = "Bearer " + key;
  try {
    res = await fetch(endpoint, {
      method: "POST",
      headers,
      body: JSON.stringify(Object.assign({
        model,
        max_tokens: 2000,
        temperature: temperature === undefined ? 0.9 : temperature,
        messages: [{role:"system", content: system}, ...messages]
      }, /gpt-oss/i.test(model) ? { reasoning_effort: "low" } : {}))
    });
  } catch (e) {
    throw new Error("BLOCKED");
  }
  if (!res.ok){
    let detail = "";
    try { const j = await res.json(); detail = (j.error && (j.error.message || j.error)) || ""; } catch (e) {}
    throw new Error("HTTP " + res.status + (detail ? ": " + (typeof detail === "string" ? detail : JSON.stringify(detail)) : ""));
  }
  const data = await res.json();
  const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  return (text || "").trim();
}

function showError(err){
  const box = $("errbox");
  box.classList.remove("hide");
  const m = err.message;
  if (m === "BLOCKED"){
    box.innerHTML = "<b>Could not reach the endpoint.</b><br><br>" +
      "For Ollama: make sure it is running, and open this file through a local server instead of straight off the disk:<br><br>" +
      "&nbsp;&nbsp;python3 -m http.server 8000<br><br>then go to http://localhost:8000.";
  } else if (/401|403|auth|api key/i.test(m)){
    box.innerHTML = "<b>The key was refused.</b><br><br>" + esc(m);
  } else if (/404|not found|model/i.test(m)){
    box.innerHTML = "<b>Model not found.</b><br><br>" + esc(m) + "<br><br>" +
      (endpoint.includes("localhost")
        ? "For Ollama, pull it first, for example: ollama pull llama3.1"
        : "Hosted providers retire models. Open the provider's /models list (Groq: https://api.groq.com/openai/v1/models) and paste a current model id into the Model box.");
  } else if (/429|rate/i.test(m)){
    box.innerHTML = "<b>Rate limited.</b> Wait a few seconds and try again.<br><br>" + esc(m);
  } else {
    box.innerHTML = "<b>The model did not answer.</b><br><br>" + esc(m);
  }
}
function clearError(){ $("errbox").classList.add("hide"); $("errbox").innerHTML = ""; }

/* ---------------- exact-length generation ---------------- */
function tidy(s){
  s = s.replace(/\s+/g, " ").trim();
  if (/^["'\u201c].*["'\u201d]$/.test(s)) s = s.slice(1, -1).trim();
  return s;
}

function forceLength(s, n){
  if (s.length === n) return s;
  if (s.length > n){
    let cut = s.slice(0, n);
    if (s[n] !== " " && cut.includes(" ") && n - cut.lastIndexOf(" ") <= 12) cut = cut.slice(0, cut.lastIndexOf(" "));
    s = cut.trimEnd();
  }
  return s + ".".repeat(n - s.length);
}

async function answerWithLength(question, n){
  const words = Math.max(1, Math.round(n / 5.5));
  const system = PERSONAS[persona] + "\n" + CRAFT +
    "\nLENGTH RULE: your reply must be exactly " + n + " characters long, counting spaces and punctuation. " +
    "That is roughly " + words + " words. Reply with the answer text only.";

  const history = [];
  turns.forEach(t => {
    history.push({role:"user", content:t.q});
    history.push({role:"assistant", content:t[impostor]});
  });
  history.push({role:"user", content:question + "\n\n(Answer in exactly " + n + " characters.)"});

  let best = "", msgs = history;
  for (let attempt = 0; attempt < 5; attempt++){
    const text = tidy(await callModel(system, msgs, attempt === 0 ? 0.9 : 0.6));
    if (text.length === n) return text;
    if (!best || Math.abs(text.length - n) < Math.abs(best.length - n)) best = text;
    const diff = text.length - n;
    msgs = [...history,
      {role:"assistant", content:text},
      {role:"user", content:"That was " + text.length + " characters. It must be exactly " + n + ", so " +
        (diff > 0 ? "cut " + diff : "add " + (-diff)) + " characters. Same answer, same voice. Reply with the text only."}];
  }
  return forceLength(best, n);
}

/* ---------------- rendering ---------------- */
function render(){
  $("crumb").innerHTML = "<b>" + turns.length + "</b> question" + (turns.length === 1 ? "" : "s") + " asked" +
    (score.played > 0 ? " &middot; " + score.right + " of " + score.played + " called correctly" : "");

  $("transcript").innerHTML = turns.map(t => {
    const slips = ["A","B"].map(slot => {
      let stamp = null;
      if (phase === "reveal") stamp = slot === impostor ? "MACHINE" : "HUMAN";
      return '<div class="slip">' +
        (stamp ? '<div class="stamp ' + (stamp === "HUMAN" ? "h" : "m") + '">' + stamp + '</div>' : '') +
        '<div class="tag"><span>Witness ' + slot + '</span><span>' + t[slot].length + ' characters</span></div>' +
        '<div class="body">' + esc(t[slot]) + '</div></div>';
    }).join("");
    return '<div class="exchange"><div class="qline"><span>The judge asks</span>' + esc(t.q) +
      '</div><div class="slips">' + slips + '</div></div>';
  }).join("");

  $("controls").classList.toggle("hide", phase !== "play");
  $("ask").disabled = busy || !!awaiting;
  $("q").disabled = busy || !!awaiting;
  $("callA").disabled = turns.length === 0 || busy || !!awaiting;
  $("callB").disabled = turns.length === 0 || busy || !!awaiting;
}

const chipsEl = $("chips");
STARTERS.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s;
  b.addEventListener("click", () => { $("q").value = s; $("q").focus(); });
  chipsEl.appendChild(b);
});

/* ---------------- asking ---------------- */
function ask(){
  const question = $("q").value.trim();
  if (!question || busy || awaiting) return;
  clearError();
  $("q").value = "";
  awaiting = { q: question };
  $("pendingq").textContent = question;
  $("pending").classList.remove("hide");
  $("volunteer").classList.remove("hide");
  $("waitmsg").classList.add("hide");
  render();
  $("htext").focus();
}

async function submitHuman(){
  if (!awaiting || busy) return;
  const human = $("htext").value.replace(/\s+/g, " ").trim();
  if (!human) return;

  busy = true;
  $("volunteer").classList.add("hide");
  $("waitmsg").classList.remove("hide");
  render();

  try {
    const machine = await answerWithLength(awaiting.q, human.length);
    const other = impostor === "A" ? "B" : "A";
    const row = { q: awaiting.q };
    row[impostor] = machine;
    row[other] = human;
    turns.push(row);
    $("htext").value = "";
    awaiting = null;
    $("pending").classList.add("hide");
  } catch (err){
    showError(err);
    $("waitmsg").classList.add("hide");
    $("volunteer").classList.remove("hide");
  } finally {
    busy = false; render();
    if (!awaiting) $("q").focus();
  }
}

$("ask").addEventListener("click", ask);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
$("showboth").addEventListener("click", submitHuman);
$("htext").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submitHuman();
});

/* ---------------- the call ---------------- */
function callIt(pick){
  const correct = pick !== impostor;
  score = { right: score.right + (correct ? 1 : 0), played: score.played + 1 };
  phase = "reveal";
  render();

  const v = $("verdict");
  v.classList.remove("hide");
  v.innerHTML = "<h3>" + (correct ? "Correct. " : "Wrong. ") + "Witness " + impostor + " was the model.</h3>" +
    "<p>It played " + esc(persona.toLowerCase()) + " for " + turns.length + " question" +
    (turns.length === 1 ? "" : "s") + ".</p>" +
    '<div style="margin-top:1rem;display:flex;gap:.7rem">' +
      '<button id="again">Play again</button>' +
      '<button id="keep" class="ghost">Keep questioning</button>' +
    '</div>';

  $("again").addEventListener("click", newGame);
  $("keep").addEventListener("click", () => {
    phase = "play"; v.classList.add("hide"); render(); $("q").focus();
  });
}
$("callA").addEventListener("click", () => callIt("A"));
$("callB").addEventListener("click", () => callIt("B"));

function newGame(){
  impostor = Math.random() < 0.5 ? "A" : "B";
  turns = []; awaiting = null; phase = "setup";
  $("htext").value = "";
  clearError();
  $("verdict").classList.add("hide");
  $("pending").classList.add("hide");
  $("game").classList.add("hide");
  $("setup").classList.remove("hide");
  $("teststatus").textContent = "";
  render();
}

render();
</script>
</body>
</html>
